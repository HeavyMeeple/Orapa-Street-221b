<script>
const H3=Math.sqrt(3)/2,U=48,M=34,$=id=>document.getElementById(id);
const PAL={R:'#d03a2a',Y:'#e6b422',B:'#2f5fc4',W:'#f4f4f4'},CN={R:'แดง',Y:'เหลือง',B:'น้ำเงิน',W:'ขาว'};
const SH=[
{n:'เฮกซากอนไวโอลิน',c:'R',p:[[[1,4],[1.5,3],[2.5,3],[3,4],[2.5,5],[1.5,5]]],h:[[[2.5,3],[3,2]]]},
{n:'ทรงกระบวย',c:'R',p:[[[1,4],[3,4],[2.5,5],[1.5,5]]],h:[[[3,4],[4,4]]]},
{n:'RACHE',c:'R',p:[[[1.5,3],[3.5,3],[3,4],[1,4]]],h:[]},
{n:'เต็นท์/หมวก',c:'Y',p:[[[1.5,3],[2.5,3],[3,4],[1,4]]],h:[[[3,4],[4,4]]]},
{n:'พิมพ์ดีด',c:'Y',p:[[[1,4],[3,4],[2.5,5],[1.5,5]]],h:[]},
{n:'แว่นขยาย',c:'Y',p:[[[1,2],[2,2],[2.5,3],[1.5,3]]],h:[[[1.5,3],[1,4]]]},
{n:'ปลา/ลูกศร',c:'B',p:[[[2.5,3],[3.5,3],[3,4],[2,4]],[[1,4],[3,4],[3.5,5],[1.5,5]]],h:[]},
{n:'สามเหลี่ยม',c:'B',p:[[[2.5,3],[3.5,5],[1.5,5]]],h:[]},
{n:'คลื่น',c:'B',p:[],h:[[[0,4],[.5,3],[1,4],[1.5,3],[2,4],[2.5,3]]]},
{n:'คนเต้น',c:'W',p:[[[1.5,3],[3.5,3],[4,4],[1,4]]],h:[]},
{n:'หมวกนโปเลียน',c:'W',p:[[[1,4],[1.5,3],[2.5,3],[3,4],[2.5,5],[1.5,5]]],h:[]},
{n:'รอยเท้า',c:'W',p:[[[1.5,3],[2.5,3],[3,4],[1,4]],[[2,4],[4,4],[3.5,5],[2.5,5]]],h:[]},
{n:'ปืน',c:'W',p:[[[2,4],[3,4],[3.5,5],[2.5,5]]],h:[[[1,4],[2,4]]]}];
const xl=y=>.5*Math.abs(4-y),xr=y=>10.5-.5*Math.abs(y-3);
const inside=([x,y])=>x>=xl(y)-1e-6&&x<=xr(y)+1e-6&&y>=0&&y<=7;
const verts=(r,c)=>{const cx=c/2+(r%2)/2;return c%2==0?[[cx,r],[cx-.5,r+1],[cx+.5,r+1]]:[[cx-.5,r],[cx+.5,r],[cx,r+1]]};
const ori=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1];return dy==0?0:dx*dy>0?1:2};
const ek=(a,b)=>[a,b].map(p=>p.map(v=>Math.round(v*2))).sort().join('|');
const cells=[],EM=new Map();
for(let r=0;r<7;r++)for(let c=0;c<24;c++){const v=verts(r,c);if(!v.every(inside))continue;
 const i=cells.length,es=[[0,1],[1,2],[2,0]].map(([a,b])=>({key:ek(v[a],v[b]),o:ori(v[a],v[b]),mid:[(v[a][0]+v[b][0])/2,(v[a][1]+v[b][1])/2]}));
 cells.push({r,c,k:r+','+c,v,es,cx:(v[0][0]+v[1][0]+v[2][0])/3,cy:(v[0][1]+v[1][1]+v[2][1])/3});es.forEach(e=>{if(!EM.has(e.key))EM.set(e.key,[]);EM.get(e.key).push(i)})}
const CK=new Map(cells.map(c=>[c.k,c]));
const pip=(P,x,y)=>{let o=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[i],[c,d]=P[j];if((b>y)!=(d>y)&&x<(c-a)*(y-b)/(d-b)+a)o=!o}return o};
const ZP=[[5,2],[6,2],[6.5,3],[6,4],[5.5,5],[4.5,5],[4,4],[4.5,3]];
const zone=new Set(cells.filter(c=>pip(ZP,c.cx,c.cy)).map(c=>c.k));
const DIRS={top:{L:2,R:1},bot:{L:4,R:5},ul:{H:0,D:1},ll:{H:0,U:5},ur:{H:3,D:2},lr:{H:3,U:4}};
const OFF={top:[0,-.55],bot:[0,.65],ul:[-.5,0],ll:[-.5,0],ur:[.5,0],lr:[.5,0]};
const ports=[];
{const g={top:[],bot:[],ul:[],ll:[],ur:[],lr:[]};
 cells.forEach((c,i)=>c.es.forEach(e=>{if(EM.get(e.key).length>1)return;const[x,y]=e.mid;
  const k=e.o==0?(y<1?'top':'bot'):x<5?(y<4?'ul':'ll'):(y<3?'ur':'lr');g[k].push({kind:k,edge:e.key,cell:i,mid:e.mid})}));
 const nm={top:'5,6,7,8,9,10,11',bot:'D,E,F,G,H,I,J',ul:'4,3,2,1',ll:'A,B,C',ur:'12,13,14',lr:'N,M,L,K'};
 for(const k in g){g[k].sort((a,b)=>k=='top'||k=='bot'?a.mid[0]-b.mid[0]:a.mid[1]-b.mid[1]);const n=nm[k].split(',');g[k].forEach((p,i)=>{p.label=n[i];ports.push(p)})}}
const ordP=[...ports].sort((a,b)=>{const na=+a.label,nb=+b.label;return isNaN(na)&&isNaN(nb)?a.label.localeCompare(b.label):isNaN(na)?1:isNaN(nb)?-1:na-nb});
let P={},sel=1,mode='home',path=[],tok=new Map(),edgeTok=new Map(),errs=[],history=[],revealed=false,activePort=null;
const v0=s=>s.p.length?s.p[0][0]:s.h[0][0];
function rot1([dx,dy]){const X=dx,Y=dy*H3;return[Math.round((X*.5-Y*H3)*2)/2,Math.round((X*H3+Y*.5)/H3)]}
function tf(p,pl,o0){let o=[p[0]-o0[0],p[1]-o0[1]];for(let i=0;i<pl.rot;i++)o=rot1(o);return[o[0]+pl.ax,o[1]+pl.ay]}
function geom(id){const s=SH[id-1],pl=P[id],o0=v0(s);
 const polys=s.p.map(q=>q.map(v=>tf(v,pl,o0))),ch=s.h.map(q=>q.map(v=>tf(v,pl,o0)));
 const cs=cells.filter(c=>polys.some(q=>pip(q,c.cx,c.cy))).map(c=>c.k);
 const area=polys.reduce((a,q)=>a+Math.abs(q.reduce((t,v,i)=>{const w=q[(i+1)%q.length];return t+v[0]*w[1]-w[0]*v[1]},0))/2,0);
 return{cs,exp:Math.round(area/.5),ch,es:ch.flatMap(q=>q.slice(1).map((v,i)=>ek(q[i],v)))}}
function derive(){tok=new Map();edgeTok=new Map();errs=[];const G={};
 for(const id in P){const g=G[id]=geom(id);if(g.cs.length!==g.exp)errs.push(`#${id} ${SH[id-1].n} ยื่นออกนอกกระดาน`);
  for(const k of g.cs){if(tok.has(k))errs.push(`#${id} ซ้อนกับ #${tok.get(k)}`);if(zone.has(k))errs.push(`#${id} ทับพื้นที่กลาง`);tok.set(k,+id)}
  g.es.forEach(e=>edgeTok.set(e,+id))}
 const ids=Object.keys(P);
 for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const A=G[ids[i]].cs.map(k=>CK.get(k)),B=G[ids[j]].cs.map(k=>CK.get(k));
  if(A.some(a=>B.some(b=>a.v.some(p=>b.v.some(q=>p[0]==q[0]&&p[1]==q[1])))))errs.push(`#${ids[i]} ชิด #${ids[j]} (แตะขอบ/มุม)`)}
 return G}
function mixName(s){const r=s.has('R'),y=s.has('Y'),b=s.has('B'),w=s.has('W'),n=r+y+b;
 if(!n)return w?'ขาว':'ใส (ไม่ชนอะไร)';
 if(!w)return n==3?'ดำ':n==1?(r?'แดง':y?'เหลือง':'น้ำเงิน'):r&&y?'ส้ม':r&&b?'ม่วง':'เขียว';
 return n==3?'เทา':n==1?(r?'ชมพู':y?'เหลืองมะนาว':'ฟ้า'):r&&y?'ส้มอ่อน':r&&b?'ม่วงอ่อน':'เขียวอ่อน'}
function fire(p,L){let k=DIRS[p.kind][L],c=p.cell,E=p.edge;const pts=[p.mid],cs=new Set();
 const t0=edgeTok.get(p.edge)||tok.get(cells[p.cell].k);
 if(t0){cs.add(SH[t0-1].c);const o=cells[p.cell].es.find(e=>e.key==p.edge).o,k2=(2*o-k+12)%6,rv=(k2+3)%6,l=Object.keys(DIRS[p.kind]).find(z=>DIRS[p.kind][z]==rv);return{out:p.label,dir:l,cs,pts}}
 for(let n=0;n<500;n++){const X=cells[c].es.find(e=>e.o!==k%3&&e.key!==E);pts.push(X.mid);
  const nb=EM.get(X.key).find(i=>i!==c);
  const t=edgeTok.get(X.key)||(nb!==undefined&&tok.get(cells[nb].k));
  if(t){cs.add(SH[t-1].c);k=(2*X.o-k+12)%6;E=X.key;continue}
  if(nb===undefined){const q=ports.find(z=>z.edge==X.key),rv=(k+3)%6,l=Object.keys(DIRS[q.kind]).find(z=>DIRS[q.kind][z]==rv);return{out:q.label,dir:l,cs,pts}}
  c=nb;E=X.key}
 return{out:'?',dir:'',cs,pts}}
const pt=([x,y])=>[x*U+M,y*H3*U+M];
function tokenIcon(id){const t=SH[id-1],all=[...t.p.flat(),...t.h.flat()],xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),pad=.25,x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad,w=Math.max(...xs)-Math.min(...xs)+pad*2,h=Math.max(...ys)-Math.min(...ys)+pad*2;
 const polys=t.p.map(q=>`<polygon points="${q.map(p=>p.join(',')).join(' ')}" fill="${PAL[t.c]}" stroke="#222" stroke-width=".11" stroke-linejoin="round"/>`).join('');
 const lines=t.h.map(q=>`<polyline points="${q.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#222" stroke-width=".24" stroke-linecap="round"/><polyline points="${q.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${PAL[t.c]}" stroke-width=".15" stroke-linecap="round"/>`).join('');
 return`<svg class="token-icon" viewBox="${x0} ${y0} ${w} ${h}" role="img" aria-label="โทเคน ${t.n}">${polys}${lines}</svg>`}
function encodePuzzle(){const payload={v:1,p:Object.keys(P).map(id=>[+id,P[id].ax,P[id].ay,P[id].rot])},raw=btoa(JSON.stringify(payload));return'OR221B1-'+raw.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodePuzzle(code){if(!code.startsWith('OR221B1-'))throw Error('ไม่รู้จักรูปแบบรหัสนี้');let raw=code.slice(8).replace(/-/g,'+').replace(/_/g,'/');raw+='='.repeat((4-raw.length%4)%4);const data=JSON.parse(atob(raw));if(data.v!==1||!Array.isArray(data.p)||data.p.length<1||data.p.length>13)throw Error('ข้อมูลในรหัสไม่ถูกต้อง');const next={};for(const a of data.p){if(!Array.isArray(a)||a.length!==4)throw Error('ข้อมูลโทเคนไม่ถูกต้อง');const[id,ax,ay,rot]=a;if(!Number.isInteger(id)||id<1||id>SH.length||next[id]||!Number.isFinite(ax)||Math.abs(ax)>32||Math.abs(ax*2-Math.round(ax*2))>1e-6||!Number.isInteger(ay)||Math.abs(ay)>32||!Number.isInteger(rot)||rot<0||rot>5)throw Error('ตำแหน่งโทเคนในรหัสไม่ถูกต้อง');next[id]={ax,ay,rot}}return next}

function draw(){const G=derive(),W=10.5*U+2*M,Hh=7*H3*U+2*M,s=$('svg');s.setAttribute('viewBox',`0 0 ${W} ${Hh}`);let h='';
 for(const c of cells){const t=(mode=='manual'||revealed)?tok.get(c.k):null;let f='none';if(zone.has(c.k))f='var(--zone)';if(t)f=PAL[SH[t-1].c];
  h+=`<polygon data-k="${c.k}" points="${c.v.map(p=>pt(p).join()).join(' ')}" fill="${f}" fill-opacity="${t?.9:.85}" stroke="#777"/>`}
 if(mode=='manual'||revealed)for(const id in G)for(const q of G[id].ch){const pts=q.map(p=>pt(p).join()).join(' ');h+=`<polyline points="${pts}" fill="none" stroke="#222" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/><polyline points="${pts}" fill="none" stroke="${PAL[SH[id-1].c]}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>`}
 if(mode=='manual')for(const id in P){const m=pt([P[id].ax,P[id].ay]);h+=`<circle cx="${m[0]}" cy="${m[1]}" r="${id==sel&&mode=='manual'?7:4}" fill="#2a8" stroke="#000" pointer-events="none"/><text x="${m[0]+8}" y="${m[1]-6}" font-size="12" font-weight="700" fill="currentColor" pointer-events="none">${id}</text>`}
 for(const p of ports){const[x,y]=pt([p.mid[0]+OFF[p.kind][0],p.mid[1]+OFF[p.kind][1]]),chosen=$('pp').value==p.label;h+=`<text data-port="${p.label}" x="${x}" y="${y+4}" font-size="12" font-weight="700" text-anchor="middle" fill="${chosen?'var(--ac)':'currentColor'}" style="cursor:pointer" pointer-events="all">${p.label}</text>`;
  if(activePort==p.label){const dirs=Object.keys(DIRS[p.kind]),horizontal=p.kind=='top'||p.kind=='bot';dirs.forEach((d,i)=>{const sign=i==0?-1:1,dx=horizontal?sign*.38:0,dy=horizontal?0:sign*.38,cx=x+dx*U,cy=y+dy*H3*U,on=$('pd').value==d;h+=`<g class="dir-choice ${on?'on':''}" data-direction="${d}" role="button" aria-label="ยิงทิศ ${d}"><circle cx="${cx}" cy="${cy}" r="10"/><text x="${cx}" y="${cy+4}" text-anchor="middle">${d}</text></g>`})}}
 if(path.length&&(mode=='manual'||revealed))h+=`<polyline points="${path.map(p=>pt(p).join()).join(' ')}" fill="none" stroke="#c0f" stroke-width="3" stroke-dasharray="6 4" pointer-events="none"/>`;
 s.innerHTML=h;
 const ids=Object.keys(P),cols=new Set(ids.map(i=>SH[i-1].c));
 $('codeOut').value=ids.length?encodePuzzle():'';
 $('used').innerHTML=(mode=='manual'||mode=='r6'||mode=='r7')&&ids.length?'<b>โทเคนที่ใช้:</b> '+ids.map(i=>`<span class="token-entry" title="โทเคน #${i}: ${SH[i-1].n}">${tokenIcon(i)}</span>`).join(' '):'';
 $('reveal').hidden=mode=='manual';$('reveal').textContent=revealed?'🙈 ซ่อนเฉลย':'👁 เฉลย';
 $('history').innerHTML=history.length?'<b>History</b><br>'+history.map((x,i)=>`${i+1}. ถาม ${x.q} → ช่อง ${x.out} สี ${x.color}${x.duplicate?' <span class="bad">(ถามซ้ำ)</span>':''}`).join('<br>'):'';
 $('msg').innerHTML=(mode=='manual'&&ids.length?`ใช้ ${ids.length} ชิ้น · สี: ${[...cols].map(c=>CN[c]).join(', ')}`+(ids.length>=5&&cols.size<4?'<br><span class="bad">ต้องมีครบ 4 สี</span>':''):'')+errs.map(x=>`<br><span class="bad">⚠ ${x}</span>`).join('')+(mode=='manual'&&ids.length&&!errs.length?'<br><span class="ok">กฎการวางผ่าน</span>':'')}
function ui(){$('toks').innerHTML=SH.map((t,i)=>`<button data-t="${i+1}" class="${sel==i+1?'on':''}" title="${t.n}">${tokenIcon(i+1)} <small>#${i+1}${P[i+1]?' ✓':''}</small></button>`).join('')}
$('svg').onclick=e=>{const direction=e.target.closest('[data-direction]');if(direction){$('pd').value=direction.dataset.direction;draw();return}const port=e.target.closest('[data-port]');if(port){$('pp').value=port.dataset.port;activePort=port.dataset.port;dopt();draw();return}if(mode!='manual')return;const s=$('svg'),q=s.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const m=q.matrixTransform(s.getScreenCTM().inverse());
 const x=(m.x-M)/U,y=(m.y-M)/(H3*U),yy=Math.max(0,Math.min(7,Math.round(y))),b=.5*(yy%2),xx=b+Math.round(x-b);
 P[sel]=Object.assign(P[sel]||{rot:0},{ax:xx,ay:yy});path=[];ui();draw()};
$('toks').onclick=e=>{const b=e.target.closest('button');if(b){sel=+b.dataset.t;ui();draw()}};
$('rot').onclick=()=>{if(P[sel]){P[sel].rot=(P[sel].rot+1)%6;path=[];draw()}};
$('del').onclick=()=>{delete P[sel];path=[];ui();draw()};
$('clr').onclick=()=>{P={};path=[];ui();draw()};
$('pp').innerHTML=ordP.map(p=>`<option>${p.label}</option>`).join('');
const pOf=l=>ports.find(p=>p.label==l);
function dopt(){$('pd').innerHTML=Object.keys(DIRS[pOf($('pp').value).kind]).map(l=>`<option>${l}</option>`).join('')}
$('pp').onchange=()=>{activePort=$('pp').value;dopt();draw()};dopt();
$('fire').onclick=()=>{derive();const p=pOf($('pp').value),d=$('pd').value,q=p.label+d,r=fire(p,d),color=mixName(r.cs),duplicate=history.some(x=>x.q==q);path=r.pts;history.push({q,out:r.out+r.dir,color,duplicate});$('res').innerHTML=`${duplicate?'<span class="bad">⚠ เคยถามคำถามนี้แล้ว</span><br>':''}ยิง <b>${q}</b> ออก <b>${r.out}${r.dir}</b> สี <b>${color}</b>`;draw()};
$('reveal').onclick=()=>{revealed=!revealed;draw()};
$('copyCode').onclick=async()=>{const code=$('codeOut').value;if(!code){$('codeMsg').textContent='ยังไม่มีโจทย์ให้คัดลอก';return}try{await navigator.clipboard.writeText(code);$('codeMsg').textContent='คัดลอกรหัสแล้ว ส่งรหัสนี้ให้เพื่อนได้เลย'}catch(e){$('codeOut').focus();$('codeOut').select();const ok=document.execCommand('copy');$('codeMsg').textContent=ok?'คัดลอกรหัสแล้ว ส่งรหัสนี้ให้เพื่อนได้เลย':'เลือกข้อความในช่องรหัสแล้วคัดลอกได้เลย'}};
$('loadCode').onclick=()=>{try{P=decodePuzzle($('codeIn').value.trim());const n=Object.keys(P).length;mode=n==5?'r5':n==6?'r6':n==7?'r7':'manual';path=[];history=[];revealed=false;activePort=null;$('res').innerHTML='';$('codeMsg').textContent='เปิดโจทย์จากรหัสแล้ว';$('home').hidden=true;$('app').hidden=false;$('manual').hidden=mode!='manual';$('rr').hidden=mode=='manual';$('ttl').textContent=mode=='manual'?'โจทย์จากรหัส':`สุ่ม ${n} ชิ้น`;ui();draw()}catch(e){$('codeMsg').textContent='เปิดรหัสไม่ได้: '+e.message}};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function vset(g){const s=new Set();g.cs.forEach(k=>CK.get(k).v.forEach(p=>s.add(p.join())));g.ch.forEach(q=>q.forEach(p=>s.add(p.join())));return s}
function tryPlace(id,used){for(let t=0;t<400;t++){const yy=Math.floor(Math.random()*8),b=.5*(yy%2),xx=b+Math.floor(Math.random()*12);
 P[id]={rot:Math.floor(Math.random()*6),ax:xx,ay:yy};const g=geom(id);
 if(g.cs.length!==g.exp||g.cs.some(k=>zone.has(k)))continue;
 if(!g.ch.every(q=>q.slice(1).every((v,i)=>EM.has(ek(q[i],v)))))continue;
 if(g.ch.some(q=>q.slice(1).some((v,i)=>{const cs=EM.get(ek(q[i],v))||[];return cs.length&&cs.every(ci=>zone.has(cells[ci].k))})))continue;
 const vs=vset(g);if([...vs].some(v=>used.has(v)))continue;return vs}
 delete P[id];return null}
function randomize(n){history=[];revealed=false;activePort=null;$('res').innerHTML='';for(let a=0;a<300;a++){P={};const ids=shuf([...Array(13).keys()].map(i=>i+1)).slice(0,n);
 if(new Set(ids.map(i=>SH[i-1].c)).size<4)continue;const used=new Set();let ok=true;
 for(const id of ids){const vs=tryPlace(id,used);if(!vs){ok=false;break}vs.forEach(v=>used.add(v))}
 if(ok){path=[];history=[];revealed=false;$('res').innerHTML='';draw();return}}
 P={};draw();$('msg').innerHTML='<span class="bad">สุ่มไม่สำเร็จ ลองกดใหม่</span>'}
function start(m){mode=m;P={};path=[];history=[];revealed=false;activePort=null;$('res').innerHTML='';$('home').hidden=true;$('app').hidden=false;
 $('manual').hidden=m!='manual';$('rr').hidden=m=='manual';
 $('ttl').textContent=m=='manual'?'ตั้งโจทย์เอง':m=='r7'?'สุ่ม 7 ชิ้น':m=='r6'?'สุ่ม 6 ชิ้น':'สุ่ม 5 ชิ้น';
 if(m=='manual'){ui();draw()}else randomize(m=='r7'?7:m=='r6'?6:5)}
$('m0').onclick=()=>start('manual');$('m7').onclick=()=>start('r7');$('m6').onclick=()=>start('r6');$('m5').onclick=()=>start('r5');
$('rr').onclick=()=>randomize(mode=='r7'?7:mode=='r6'?6:5);
$('back').onclick=()=>{mode='home';$('app').hidden=true;$('home').hidden=false};
</script></body></html>
